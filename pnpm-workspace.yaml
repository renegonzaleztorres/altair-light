# Supply-chain safety policy: do not resolve package versions until they have
# been public for at least 24 hours. This applies to direct and transitive
# dependencies. Keep exceptions rare, version-specific, and documented.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

# @tailwindcss/cli depends on @parcel/watcher, whose install script only
# compiles from source when no prebuilt binary exists. The prebuilt binaries
# come through optional dependencies, so the script stays denied.
allowBuilds:
  '@parcel/watcher': false
